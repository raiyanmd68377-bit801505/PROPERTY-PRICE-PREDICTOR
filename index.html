<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
</head>
<body>

    <h1>House Price Predictor</h1>
    <p>Predict your house price using Machine Learning.</p>

    <form>
        <label>Area (sq ft)</label>
        <input type="number" name="area" placeholder="Enter area">

        <label>Bedrooms</label>
        <input type="number" name="bedrooms" placeholder="Enter bedrooms">

        <label>Bathrooms</label>
        <input type="number" name="bathrooms" placeholder="Enter bathrooms">

        <label>Stories</label>
        <input type="number" name="stories" placeholder="Enter stories">

        <label>Parking</label>
        <input type="number" name="parking" placeholder="Enter parking">

        <button type="button">Predict Price</button>
    </form>

</body>
</html>
